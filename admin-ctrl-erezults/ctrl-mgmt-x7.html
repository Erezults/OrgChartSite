<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <title>Admin Panel | התקנה</title>
    <meta name="description" content="דף התקנה ייעודי לאפליקציית האדמין" />

    <link rel="icon" href="/admin-icon-192.png" type="image/png" />
    <link rel="manifest" href="/admin-manifest.json" />
    <link rel="apple-touch-icon" href="/admin-icon-192.png" />

    <meta name="theme-color" content="#0a1628" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Admin Panel" />

    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: hsl(210 59% 10%);
        color: hsl(0 0% 100%);
        font-family: system-ui, -apple-system, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        width: min(560px, calc(100vw - 48px));
        padding: 24px;
        border-radius: 16px;
        background: hsl(210 59% 14%);
        box-shadow: 0 12px 40px hsl(210 59% 6% / 0.5);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 22px;
      }
      p {
        margin: 0 0 12px;
        opacity: 0.92;
        line-height: 1.55;
      }
      a {
        color: hsl(0 0% 100%);
        text-decoration: underline;
      }
      .btn {
        display: inline-block;
        margin-top: 8px;
        padding: 12px 14px;
        border-radius: 12px;
        text-decoration: none;
        background: hsl(210 59% 18%);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>התקנת Admin Panel</h1>
      <p>
        דף זה נועד להתקנה של אפליקציית אדמין נפרדת במסך הבית באייפון, כך שתוכל להיות מותקנת יחד עם ה-PWA הראשי.
      </p>
      <p>
        התקנה: Share → Add to Home Screen.
      </p>

      <p>
        <a class="btn" href="/admin-ctrl-erezults/login?source=pwa">פתח את מסך האדמין</a>
      </p>
    </main>

    <script>
      // Unregister ALL service workers to prevent interference with the admin PWA
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
      }

      // Auto-enter the admin app when launched as an installed app (iOS + Desktop).
      var isStandalone = false;
      try {
        isStandalone =
          (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
          (window.matchMedia && window.matchMedia('(display-mode: window-controls-overlay)').matches) ||
          (window.navigator && window.navigator.standalone === true);
      } catch (e) {}

      if (isStandalone) {
        window.location.replace('/admin-ctrl-erezults/login?source=pwa');
      }
    </script>
  </body>
</html>
